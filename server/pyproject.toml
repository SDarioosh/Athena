[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "convo-server"
version = "0.1.0"
description = "convo-ai local server: ingestion, VAD, transcription, diarization, summaries, storage"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
# Silero VAD (pulls in torch; install the CPU wheel index if you have no GPU)
vad = ["silero-vad>=5.1"]
# Speaker embeddings for diarization + voice enrollment (ECAPA-TDNN)
diarization = ["speechbrain>=1.0", "torchaudio>=2.1"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
convo-server = "convo_server.cli:main"

[tool.setuptools.packages.find]
include = ["convo_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
