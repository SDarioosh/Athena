[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-server"
version = "0.1.0"
description = "Athena local server: ingestion, VAD, transcription, diarization, summaries, storage"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
# Silero VAD (pulls in torch; install the CPU wheel index if you have no GPU)
vad = ["silero-vad>=5.1"]
# Speaker embeddings for diarization + voice enrollment (ECAPA-TDNN)
diarization = ["speechbrain>=1.0", "torchaudio>=2.1"]
# pyannote.audio diarization backend (CONVO_DIARIZER=pyannote); use with `diarization`
pyannote = ["pyannote.audio>=4.0"]
# recognition eval (eval/recognition.py): word error rate and diarization error;
# pyroomacoustics (MIT) simulates the far-field room for --audio sim
eval = ["jiwer>=3.0", "pyannote.metrics>=3.2", "pyroomacoustics>=0.7"]
# Parakeet TDT 0.6B v3 transcriber on CPU (CONVO_TRANSCRIBER=parakeet)
parakeet = ["sherpa-onnx>=1.13"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
athena = "athena.cli:main"
# The old CLI name: deployed services, cron jobs and notes run `convo-server`.
convo-server = "athena.cli:main"

[tool.setuptools.packages.find]
# convo_server: the old package name, kept importable as an alias of athena.
include = ["athena*", "convo_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/seed_demo.py" = ["E501"]  # transcript data lines
