name: android-relay-release

# Builds the Android relay's debug APK and attaches it to a GitHub Release.
# Push a tag such as relay-v0.1.0, or run it by hand (Actions > android-relay-release >
# Run workflow) with a tag name; a missing tag is created on the chosen branch's head.

on:
  push:
    tags: ["relay-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (relay-v<version>, e.g. relay-v0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: android-relay-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the tag name
        run: |
          if [[ ! "$TAG" =~ ^relay-v[0-9A-Za-z._-]+$ ]]; then
            echo "::error::tag must look like relay-v0.1.0, got '$TAG'"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit-test the debug APK
        working-directory: android-relay
        run: ./gradlew assembleDebug test --no-daemon
      - name: Name the APK after the tag
        id: apk
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' android-relay/app/build.gradle.kts)
          if [ "relay-v$version" != "$TAG" ]; then
            echo "::warning::tag $TAG doesn't match versionName $version in android-relay/app/build.gradle.kts"
          fi
          apk="barvis-sound-relay-${TAG#relay-}-debug.apk"
          cp android-relay/app/build/outputs/apk/debug/app-debug.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "file=$apk" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
          if-no-files-found: error
      - name: Create or update the release
        env:
          APK: ${{ steps.apk.outputs.file }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            notes="Android relay $VERSION (versionName), built from ${GITHUB_SHA::7}.

          Debug build, signed with the Android SDK's debug key: fine for sideloading on your own phone, not for a store. Install with \`adb install -r $APK\`, or open the APK on the phone. Setup: android-relay/README.md."
            gh release create "$TAG" "$APK" "$APK.sha256" \
              --target "$GITHUB_SHA" --title "Android relay $TAG" --notes "$notes"
          fi
