name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: hashFiles('server/pyproject.toml') != ''
        with:
          python-version: "3.11"
      - name: Lint and test server
        if: hashFiles('server/pyproject.toml') != ''
        working-directory: server
        run: |
          pip install -e ".[dev]" || pip install -e . pytest ruff
          ruff check .
          python -m pytest -q
