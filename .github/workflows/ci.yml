name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: hashFiles('server/pyproject.toml') != ''
        with:
          python-version: "3.11"
      - name: Lint and test server
        if: hashFiles('server/pyproject.toml') != ''
        working-directory: server
        run: |
          pip install -e ".[dev]" || pip install -e . pytest ruff
          ruff check .
          python -m pytest -q

  messages-relay:
    # the Mac's messages relay: standard library only, Python 3.8 (macOS 10.15) and newer
    # In the python image: setup-python has no 3.8 for the newer Ubuntu runners.
    runs-on: ubuntu-latest
    container: python:${{ matrix.python-version }}-slim
    strategy:
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Lint and test the messages relay
        run: |
          pip install pytest ruff
          ruff check messages-relay
          python -m pytest -q messages-relay

  server-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Docker: build the images, start sound-api, sound-mcp and whisper-cpu"
        working-directory: server
        run: |
          cat > .env <<EOF
          CONVO_INGEST_TOKEN=ci-ingest-token-0123456789abcdef
          CONVO_MCP_TOKEN=ci-mcp-token-0123456789abcdef
          CONVO_DIARIZATION=false
          COMPOSE_PROFILES=whisper-cpu
          CONVO_DOCKER_WHISPER_MODEL=ggml-tiny.en.bin
          PUID=$(id -u)
          PGID=$(id -g)
          EOF
          mkdir -p data/whisper-models
          curl -sSL -o data/whisper-models/ggml-tiny.en.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
          docker compose up -d --build --wait --wait-timeout 300
          curl -sf http://127.0.0.1:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8001/mcp)" = 401
          docker compose exec -T sound-api python -c \
            "import urllib.request as u; u.urlopen('http://whisper:8178/', timeout=5)"
          # the CLI under both names, and the old package name as an alias
          docker compose exec -T sound-api sh -c \
            "athena --help >/dev/null && convo-server --help >/dev/null && python -m convo_server.cli --help >/dev/null"
      - name: Container logs
        if: failure()
        working-directory: server
        run: docker compose logs --tail 80

  meeting-bot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: "Zoom meeting bot core: build and host tests (no Zoom SDK)"
        if: hashFiles('meeting-bot/CMakeLists.txt') != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config libcurl4-openssl-dev libopus-dev libopusenc-dev libogg-dev \
            ffmpeg opus-tools
          cmake -S meeting-bot -B build-bot && cmake --build build-bot -j && ctest --test-dir build-bot --output-on-failure
      - name: "Zoom meeting bot: build against the sandbox stub SDK and run its scenarios (not Zoom's SDK)"
        if: hashFiles('meeting-bot/bot/sdkstub/stub_meetingsdk.cpp') != ''
        run: |
          sudo apt-get install -y --no-install-recommends libglib2.0-dev
          cmake -S meeting-bot -B build-bot-stub -DZOOM_SDK_DIR="$PWD/meeting-bot/bot/sdkstub"
          cmake --build build-bot-stub -j && ctest --test-dir build-bot-stub --output-on-failure
      - name: "Zoom meeting bot: idle and cost check (stub SDK, fictional fixture made at run time)"
        if: hashFiles('meeting-bot/bot/sdkstub/stub_meetingsdk.cpp') != ''
        # stdlib only (no server venv): CPU, VmPeak, peak RSS; fails on any process, socket
        # or file the bot leaves behind (server/README.md "Meeting bot cost check")
        run: python3 server/scripts/meeting_bot_cost.py build-bot-stub/athena-meeting-bot --seconds 20

  firmware-twatch-ultra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Host tests (pure logic: audio, Ogg/Opus writer, chunk queue, BLE protocol, ...)"
        run: |
          cmake -S firmware/recorder/test -B build-host
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure
      - name: "idf.py build (ESP-IDF v5.5.2, esp32s3, board twatch_ultra)"
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32s3
          path: firmware/recorder
          command: idf.py -DBOARD=twatch_ultra -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.twatch_ultra" build
      - name: "idf.py build (ESP-IDF v5.5.2, esp32s3, board twatch_s3)"
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32s3
          path: firmware/recorder
          command: idf.py -B build-s3 -DBOARD=twatch_s3 -DSDKCONFIG=build-s3/sdkconfig -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.twatch_s3" build
      - name: "idf.py build (ESP-IDF v5.5.2, esp32s3, board t4_s3)"
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32s3
          path: firmware/recorder
          command: idf.py -B build-t4 -DBOARD=t4_s3 -DSDKCONFIG=build-t4/sdkconfig -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.t4_s3" build

  firmware-t5-pda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Host tests (glance protocol, JSON/feed parsing, outbox, blob store, gestures)"
        run: |
          cmake -S firmware/pda/test -B build-pda-host
          cmake --build build-pda-host
          ctest --test-dir build-pda-host --output-on-failure
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "PDA tools: lint"
        run: |
          pip install ruff
          ruff check --config server/pyproject.toml firmware/pda/tools
      - name: "idf.py build (ESP-IDF v5.5.2, esp32s3, T5 E-Paper Pro PDA)"
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32s3
          path: firmware/pda
          command: idf.py build

  firmware-k230-ui:
    # the K230 PDA's UI (firmware/pda-k230/ui): host build, tests, the screenshot run; it
    # compiles the T5's pure modules from firmware/pda/main, so the T5 changes run it too
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: LVGL commit
        id: lvgl
        run: echo "commit=$(sed -n 's/^set(LVGL_COMMIT \([0-9a-f]*\))$/\1/p' firmware/pda-k230/ui/CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - name: "LVGL source (fetched by commit, cached)"
        uses: actions/cache@v4
        with:
          path: ~/lvgl
          key: lvgl-${{ steps.lvgl.outputs.commit }}
      - name: "Build and test (-Wall -Wextra -Werror), the screenshots"
        run: |
          cmake -DREPO=https://github.com/lvgl/lvgl.git -DCOMMIT=${{ steps.lvgl.outputs.commit }} \
            -DDIR="$HOME/lvgl" -P firmware/pda-k230/ui/cmake/fetch_commit.cmake
          cmake -S firmware/pda-k230/ui -B build-k230-ui -DFETCHCONTENT_SOURCE_DIR_LVGL="$HOME/lvgl"
          cmake --build build-k230-ui -j
          ctest --test-dir build-k230-ui --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k230-pda-screenshots
          path: build-k230-ui/screens/*.png
          if-no-files-found: warn

  firmware-k230-vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Vision core: host build and tests (no camera, no models)"
        working-directory: firmware/pda-k230/vision
        run: |
          cmake -S . -B build -DVISION_WERROR=ON
          cmake --build build -j
          ctest --test-dir build --output-on-failure
      - name: "Vision core: the same under AddressSanitizer and UBSan"
        working-directory: firmware/pda-k230/vision
        run: |
          cmake -S . -B build-asan -DVISION_SANITIZE=ON -DVISION_WERROR=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-asan -j
          ctest --test-dir build-asan --output-on-failure

  firmware-k230-syncd:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: "syncd (with the relay's athena_relay modules): lint and tests"
        run: |
          pip install pytest ruff
          ruff check --config server/pyproject.toml firmware/pda-k230
          python -m pytest -q firmware/pda-k230/syncd

  firmware-k230-e2e:
    # the real UI (headless) and the real syncd against the fake hub; vision lines from the
    # replay tool (firmware/pda-k230/tests/e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: LVGL commit
        id: lvgl
        run: echo "commit=$(sed -n 's/^set(LVGL_COMMIT \([0-9a-f]*\))$/\1/p' firmware/pda-k230/ui/CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - name: "LVGL source (fetched by commit, cached)"
        uses: actions/cache@v4
        with:
          path: ~/lvgl
          key: lvgl-${{ steps.lvgl.outputs.commit }}
      - name: "Build the UI and the vision tools"
        run: |
          cmake -DREPO=https://github.com/lvgl/lvgl.git -DCOMMIT=${{ steps.lvgl.outputs.commit }} \
            -DDIR="$HOME/lvgl" -P firmware/pda-k230/ui/cmake/fetch_commit.cmake
          cmake -S firmware/pda-k230/ui -B build-k230-ui -DPDA_TESTS=OFF -DFETCHCONTENT_SOURCE_DIR_LVGL="$HOME/lvgl"
          cmake --build build-k230-ui -j --target athena-pda
          cmake -S firmware/pda-k230/vision -B build-k230-vision -DVISION_TESTS=OFF -DVISION_TOOLS=ON
          cmake --build build-k230-vision -j --target athena-vision-replay synth_track
      - name: "End to end (fictional data only)"
        env:
          ATHENA_PDA_UI_BIN: ${{ github.workspace }}/build-k230-ui/athena-pda
          ATHENA_VISION_TOOLS: ${{ github.workspace }}/build-k230-vision
          E2E_OUT_DIR: ${{ github.workspace }}/e2e-screens
        run: |
          pip install pytest
          python -m pytest -q firmware/pda-k230/tests/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k230-pda-e2e-screenshots
          path: e2e-screens/*.png
          if-no-files-found: warn

  firmware-k230-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "shellcheck and sh -n on the image's scripts"
        run: |
          grep -rlEZ '^#!.*\b(ba|da)?sh\b|^# shellcheck shell=' firmware/pda-k230/system > scripts.lst
          xargs -0 shellcheck -x < scripts.lst
          xargs -0 -n 1 sh -n < scripts.lst

  ble-relay-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "PC BLE relay: lint and tests (no Bluetooth needed)"
        run: |
          pip install pytest ruff
          ruff check --config server/pyproject.toml firmware/recorder/tools/ble_relay.py firmware/recorder/tools/pda_relay.py firmware/recorder/tools/athena_relay firmware/recorder/tools/barvis_relay firmware/recorder/tools/tests
          python -m pytest -q firmware/recorder/tools

  android-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: "Build, unit tests and lint"
        working-directory: android-relay
        run: ./gradlew assembleDebug test lint --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-relay-debug-apk
          path: android-relay/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
