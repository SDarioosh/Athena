; PlatformIO Project Configuration for Convo-Ai
; LilyGO T-Watch S3 / Watchy (ESP32-S3 based)
;
; Note: LilyGO T-Watch S3 board not yet in PlatformIO.
; Using watchy (Watchy v2.0) as starting point.
; When T-Watch S3 board is available, update board = watchy to board = t-watch-s3

[env:watchy]
platform = espressif32
board = watchy
framework = arduino

; PSRAM configuration for Watchy (has 16MB PSRAM)
board_build.partitions = huge_app.csv

; Build flags
build_flags = 
    -D PSRAM_ESP32S3
    -D LOG_LOCAL_LEVEL=INFO

; Serial monitor settings
monitor_speed = 115200

; Upload settings
upload_speed = 921600

; Library dependencies (minimal for Feature 1: battery logging)
lib_deps = 
    bblanchon/ArduinoJson@^6.21.3
