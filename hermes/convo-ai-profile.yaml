# Settings for a dedicated Hermes profile named `convo-ai`, so the build loop
# doesn't touch your personal Hermes setup.
#
# Easiest path: run `hermes -p convo-ai model`, pick the custom endpoint option,
# and enter your llama-server URL. That writes the `model:` block for you in the
# right shape. Then add the `delegation:` block below to the profile's config.yaml.

# Main model: Qwen on your local llama-server.
model:
  provider: custom
  default: qwen3.5-35b                 # must match the name llama-server reports (--alias)
  base_url: http://127.0.0.1:8080/v1

# When Qwen calls delegate_task mid-session, the subagent runs on Claude.
# This is the in-session escalation path; the orchestrator's escalation
# (handing a whole stuck task to Claude) works independently of it.
# Note: this routes ALL subagents to Claude, so watch costs. Remove the block
# if Qwen starts delegating trivial work.
delegation:
  provider: anthropic
  model: claude-opus-5-5

# Optional: fall back to Claude only if llama-server errors or is down.
# Fallback triggers on errors, not on hard tasks. Leave this off if you'd
# rather the loop stop than spend on Claude while your server is down.
# fallback_providers:
#   - provider: anthropic
#     model: claude-sonnet-5-5
