# convo-ai orchestrator config

repo_path: ~/code/convo-ai      # local clone the orchestrator works from
base_branch: main

roles:
  builder: qwen                 # does the work first
  senior: claude                # takes over when the builder is stuck, or on `hard` issues
  reviewers: [qwen, claude]     # both must APPROVE the same commit to merge

# Each agent is a command template. {prompt_file} and {workdir} are filled in.
# Output must be Hermes `--format stream-json` so the final result and token
# counts can be parsed.
agents:
  qwen:
    metered: false              # local, no budget tracking
    can_escalate: true          # may end its reply with "ESCALATE: <reason>"
    timeout_min: 90
    cmd: [hermes, -p, convo-ai, --in, "{workdir}", chat, --oneshot, --yolo,
          --max-turns, "150", --query-file, "{prompt_file}", --format, stream-json]

  claude:
    metered: true               # counts toward metered_tokens_per_issue
    timeout_min: 60
    cmd: [hermes, -p, convo-ai, --in, "{workdir}", chat, --oneshot, --yolo,
          --provider, anthropic, --model, claude-opus-5-5,
          --max-turns, "150", --query-file, "{prompt_file}", --format, stream-json]

review_prompts:
  qwen: review_qwen.md
  claude: review_claude.md

# Local checks run after every build attempt. A check is skipped until its
# `when_exists` file exists, so an empty repo doesn't fail on day one.
checks:
  - name: firmware build
    when_exists: firmware/platformio.ini
    cmd: pio run -d firmware
    timeout_min: 30
  - name: server tests
    when_exists: server/pyproject.toml
    cmd: cd server && python -m pytest -q
  - name: server lint
    when_exists: server/pyproject.toml
    cmd: cd server && ruff check .

limits:
  build_attempts: 3                   # per agent, before escalating
  review_rounds: 3                    # then hand off to a human
  diff_chars: 60000                   # diff size sent to reviewers
  metered_tokens_per_issue: 4000000   # Claude token cap per issue

wait_for_github_checks: true          # also require GitHub Actions to pass before merging
poll_seconds: 300                     # for --watch

labels:
  ready: agent-ready
  in_progress: agent-in-progress
  hard: hard
  needs_human: needs-human

# Optional notifications. {message} is filled in.
notify_cmd: null
# notify_cmd: [hermes, -p, convo-ai, send, --to, telegram, "{message}"]
